name: Keep uv.lock up to date

on:
  push:
    branches:
      - master
    paths:
      - pyproject.toml
      - .github/workflows/uv-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate lockfile
        run: uv lock

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- uv.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build: generate uv lockfile"
            git push
          else
            echo "uv.lock is already up to date"
          fi
