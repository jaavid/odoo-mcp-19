name: Format preview

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - name: Format files
        run: |
          uv run black src/odoo_mcp/registry_admin.py src/odoo_mcp/token_crypto.py
          uv run isort src/odoo_mcp/registry_admin.py src/odoo_mcp/token_crypto.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-registry-files
          path: |
            src/odoo_mcp/registry_admin.py
            src/odoo_mcp/token_crypto.py
          if-no-files-found: error
