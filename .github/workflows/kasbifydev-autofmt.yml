name: KasbifyDev one-shot formatter

on:
  push:
    branches:
      - kasbifydev/plugin-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: kasbifydev/plugin-v1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - run: uv sync --extra dev
      - name: Format changed Python files
        run: >-
          uv run black
          src/odoo_mcp/app.py
          src/odoo_mcp/auth_verifier.py
          src/odoo_mcp/users_db.py
          tests/test_auth_verifier.py
          plugins/kasbifydev/scripts/bind_app.py
          plugins/kasbifydev/scripts/validate_plugin.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/odoo_mcp/app.py src/odoo_mcp/auth_verifier.py src/odoo_mcp/users_db.py tests/test_auth_verifier.py plugins/kasbifydev/scripts/bind_app.py plugins/kasbifydev/scripts/validate_plugin.py
          git commit -m 'style: apply Black formatting [skip ci]'
          git push origin HEAD:kasbifydev/plugin-v1
