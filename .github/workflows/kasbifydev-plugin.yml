name: KasbifyDev plugin checks

on:
  push:
    paths:
      - 'plugins/kasbifydev/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/kasbifydev-plugin.yml'
  pull_request:
    paths:
      - 'plugins/kasbifydev/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/kasbifydev-plugin.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - run: uv sync --extra dev
      - name: Validate plugin package
        run: uv run python plugins/kasbifydev/scripts/validate_plugin.py
      - name: Preview exact Black output for OAuth checker
        run: uv run black --diff plugins/kasbifydev/scripts/check_oauth.py
